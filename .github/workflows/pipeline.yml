name: Pipeline

# Runs every data-dependent phase (EDGAR → labels → baselines → DistilBERT → index →
# retrieval eval → agent) on a GitHub runner, which has the network access the dev
# sandbox lacks, then commits the measured results back to the branch.
#
# Requires the repository secret SEC_CONTACT_EMAIL (Settings → Secrets → Actions).
# It is never written to the repo or echoed in logs.
on:
  workflow_dispatch:
    inputs:
      from_phase:
        description: "Phase to start from (0-5)"
        default: "0"

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
      EMBED_BACKEND: hf
      HF_HOME: ${{ github.workspace }}/models/hf-cache
      SKIP_HAND_REVIEW: "1"
      PY: python
    steps:
      - uses: actions/checkout@v4
      - name: Check SEC contact secret
        run: |
          if [ -z "$SEC_CONTACT_EMAIL" ]; then
            echo "::error::Repository secret SEC_CONTACT_EMAIL is not set"; exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies (CPU torch)
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: models/hf-cache
          key: hf-${{ hashFiles('src/config.py') }}
      - name: Run pipeline
        run: ./run_pipeline.sh "${{ inputs.from_phase }}"
      - name: Upload fine-tuned model and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-outputs
          path: |
            models/distilbert-risk
            models/baseline
            data/processed/extraction_log.csv
          if-no-files-found: warn
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results.json RESULTS.md notebooks/*.png data/labels data/processed \
                  data/eval/*_transcript.md
          git commit -m "Record pipeline results (run ${{ github.run_id }})" || echo "nothing to commit"
          git push

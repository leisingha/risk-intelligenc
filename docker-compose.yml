# API + Chroma server. Models (fine-tuned DistilBERT, HF cache) and processed data are
# mounted from the host, so the image never bakes in weights or filings.
#
#   docker compose up -d --build
#   docker compose run --rm api python -m src.rag.index   # (re)build the index in Chroma
services:
  chroma:
    image: chromadb/chroma:0.5.5
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=False
    volumes:
      - chroma-data:/chroma/chroma
    ports:
      - "8000:8000"

  api:
    build:
      context: .
      args:
        TORCH_INDEX: ${TORCH_INDEX-https://download.pytorch.org/whl/cpu}
    env_file:
      - path: .env
        required: false
    environment:
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
    volumes:
      - ./models:/app/models
      - ./data/processed:/app/data/processed
    ports:
      - "8080:8080"
    depends_on:
      - chroma

volumes:
  chroma-data:
